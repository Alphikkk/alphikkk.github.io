<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corphik</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://corphik.eu/es/">
<meta http-equiv="refresh" content="0; url=/es/#w-ask">
<script>
/* Podrobná poptávka se zrušila: služby, košík i zpráva jsou na jedné obrazovce na úvodu.
   Staré odkazy (/orders/?service=build,web) přidají služby do košíku a přesměrují tam. */
try{
  const add = (new URLSearchParams(location.search).get('service') || "").split(",").filter(Boolean);
  if(add.length){ const c = JSON.parse(localStorage.getItem('corphikCart') || "[]"); localStorage.setItem('corphikCart', JSON.stringify([...new Set([...c, ...add])])); }
}catch(_){}
location.replace("/es/#w-ask");
</script>
</head>
<body style="background:#000;color:#f2f1ee;font-family:system-ui,sans-serif;padding:24px">
<p><a href="/es/#w-ask" style="color:#f2f1ee">Continuar a servicios y solicitud</a></p>
</body>
</html>
