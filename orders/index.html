<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corphik</title>
<meta name="description" content="Corphik – IT podpora: sestavení PC, instalace Windows a Linuxu, opravy, zabezpečení a redesign webu.">
<meta property="og:title" content="Corphik – IT podpora a zabezpečení">
<meta property="og:image" content="https://corphik.eu/assets/img/og-corphik.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/style.css?v=10">
</head>
<body data-page="orders">
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Corphik"><img src="/assets/img/corphik-wordmark.png" alt="Corphik" width="117" height="22"></a>
    <ul class="links">
      <li><a href="/" data-i18n="nav.home"></a></li>
      <li><a href="/portfolio/" data-i18n="nav.portfolio"></a></li>
      <li><a href="/about/" data-i18n="nav.about"></a></li>
      <li class="only-sm"><a href="/orders/" data-i18n="nav.order" aria-current="page"></a></li>
    </ul>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="cs">CS</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
      <button class="theme" id="theme" type="button" aria-label="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
      <a class="cta" href="/orders/" data-i18n="nav.order" aria-current="page"></a>
    </div>
  </div>
</header>
<main>
<div class="wrap page-head"><h1 data-i18n="ck.title"></h1><p data-i18n="ck.sub"></p></div>
<div class="wrap checkout">
  <form class="ck-form" id="ckForm" novalidate>
    <section class="panel" aria-labelledby="s1">
      <h2 id="s1"><span class="num">1</span><span data-i18n="ck.s1"></span></h2>
      <label class="fld"><span data-i18n="ck.name"></span><input id="ckName" autocomplete="name" required></label>
      <div class="two">
        <label class="fld"><span data-i18n="ck.email"></span><input id="ckEmail" type="email" autocomplete="email" required></label>
        <label class="fld"><span data-i18n="ck.phone"></span><input id="ckPhone" type="tel" autocomplete="tel"></label>
      </div>
    </section>
    <section class="panel" aria-labelledby="s2">
      <h2 id="s2"><span class="num">2</span><span data-i18n="ck.s2"></span></h2>
      <label class="fld"><span data-i18n="ck.service"></span><select id="ckService"></select></label>
      <label class="fld"><span data-i18n="ck.msg"></span><textarea id="ckMsg" required></textarea></label>
    </section>
    <section class="panel" aria-labelledby="s3">
      <h2 id="s3"><span class="num">3</span><span data-i18n="ck.s3"></span></h2>
      <label class="fld"><span data-i18n="ck.country"></span>
        <select id="ckCountry">
          <option value="cz" data-i18n="ck.cz"></option>
          <option value="es" data-i18n="ck.es"></option>
          <option value="eu" data-i18n="ck.eu"></option>
        </select>
      </label>
      <div class="fld"><span data-i18n="ck.mode"></span>
        <div class="modes" role="radiogroup">
          <label><input type="radio" name="mode" id="modeOnsite" value="onsite" checked><span data-i18n="ck.onsite"></span></label>
          <label><input type="radio" name="mode" id="modeRemote" value="remote"><span data-i18n="ck.remote"></span></label>
        </div>
        <p class="note" id="remoteNa" data-i18n="ck.remoteNa" hidden></p>
        <p class="note" id="abroadNote" role="status" hidden></p>
      </div>
      <label class="fld" id="addrWrap"><span data-i18n="ck.address"></span><input id="ckAddr" autocomplete="street-address"></label>
      <label class="fld"><span data-i18n="ck.when"></span><input id="ckWhen"></label>
    </section>
    <label class="consent"><input type="checkbox" id="ckConsent"><span data-i18n="ck.consent"></span></label>
    <div class="hp" aria-hidden="true"><label>Web<input id="ckHp" tabindex="-1" autocomplete="off"></label></div>
    <p class="ck-err" id="ckErr" role="alert"></p>
    <button class="submit" id="ckSubmit" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg><span data-i18n="ck.submit"></span></button>
  </form>
  <aside class="summary" aria-labelledby="sumH">
    <h2 id="sumH" data-i18n="ck.sum"></h2>
    <div class="sum-svc"><b id="sumName"></b><p id="sumDesc"></p></div>
    <div class="sum-price"><span data-i18n="ck.price"></span><b id="sumPrice"></b></div>
    <div class="pay"><b data-i18n="ck.payH"></b><p data-i18n="ck.pay"></p></div>
    <p class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-i18n="ck.secure"></span></p>
  </aside>
</div>
</main>
<footer><div class="wrap">
  <img class="foot-logo" src="/assets/img/corphik-logo.png" alt="Corphik – Reliable IT support &amp; custom PCs" width="150" height="61" loading="lazy">
  <div class="foot-meta"><span>© <span class="year">2026</span> Corphik, Aleš Pospíšil</span><span><span data-i18n="ft.contact"></span>: <a class="mail" href="mailto:ales@corphik.eu">ales@corphik.eu</a></span></div>
  <div class="social"><a href="https://www.instagram.com/corphik" target="_blank" rel="me noopener">Instagram</a><a href="https://www.linkedin.com/company/corphik" target="_blank" rel="me noopener">LinkedIn</a></div>
</div></footer>
<script src="/assets/app.js?v=12"></script>
</body>
</html>
